name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: foodlink
          POSTGRES_USER: foodlink
          POSTGRES_PASSWORD: foodlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodlink -d foodlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify dependencies
        run: go mod download

      - name: Check Go format
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files not formatted correctly. Run gofmt -w ."
            gofmt -l .
            exit 1
          fi

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test -v -race ./...

      - name: Build Go binary
        run: go build -v ./cmd/api

      - name: Install Hurl
        run: |
          HURL_VERSION=8.0.0
          curl --fail --silent --show-error --location \
            "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar --extract --gzip --directory /tmp
          echo "/tmp/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Run PostgreSQL API smoke test
        env:
          DATABASE_URL: postgres://foodlink:foodlink@localhost:5432/foodlink?sslmode=disable
          DEMO_JWT_SECRET: ci-smoke-secret
        run: |
          set -euo pipefail
          go run ./cmd/api --migrate
          go run ./cmd/api > /tmp/foodlink-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/foodlink-api.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/health > /dev/null
          hurl --test --variable base_url=http://127.0.0.1:8080 smoke/api.hurl

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome linter
        run: pnpm lint

      - name: Build frontend
        run: pnpm build

  backend-image:
    name: Backend Image
    runs-on: ubuntu-latest
    needs: backend-ci
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
