apiVersion: v1
kind: Service
metadata:
  name: foodlink-postgresql
  labels:
    app.kubernetes.io/part-of: foodlink
    app.kubernetes.io/component: postgresql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: foodlink-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: foodlink-postgresql
  labels:
    app.kubernetes.io/part-of: foodlink
    app.kubernetes.io/component: postgresql
spec:
  serviceName: foodlink-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: foodlink-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foodlink-postgresql
        app.kubernetes.io/part-of: foodlink
        app.kubernetes.io/component: postgresql
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: foodlink
            - name: POSTGRES_USER
              value: foodlink
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: foodlink-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [pg_isready, -U, foodlink, -d, foodlink]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, foodlink, -d, foodlink]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 8Gi
