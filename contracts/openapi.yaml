openapi: 3.0.3
info:
  title: FoodLink API
  version: 1.0.0
  description: Contract-first API for volunteer-driven food delivery matching.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Donations
  - name: Receivers
  - name: DeliveryProposals
  - name: Pickups
  - name: Notifications
paths:
  /auth/demo-login:
    post:
      tags: [Auth]
      operationId: demoLogin
      summary: Log in as a seeded demo user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoLoginRequest"
      responses:
        "200":
          description: Demo login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoLoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /me:
    get:
      tags: [Users]
      operationId: getMe
      summary: Get current authenticated user.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /me/profile:
    get:
      tags: [Users]
      operationId: getMyProfile
      summary: Get current user's profile.
      responses:
        "200":
          description: Current profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Users]
      operationId: updateMyProfile
      summary: Update current user's profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /donations:
    get:
      tags: [Donations]
      operationId: listDonations
      summary: List donations visible to current role.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DonationStatus"
      responses:
        "200":
          description: Paged donations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Donations]
      operationId: createDonation
      summary: Create a donation. Donor only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDonationRequest"
      responses:
        "201":
          description: Donation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /donations/{id}:
    get:
      tags: [Donations]
      operationId: getDonation
      summary: Get donation by ID.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Donation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /receivers:
    get:
      tags: [Receivers]
      operationId: listReceivers
      summary: List receiver profiles. Volunteer only.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paged receiver profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /delivery-proposals:
    get:
      tags: [DeliveryProposals]
      operationId: listDeliveryProposals
      summary: List delivery proposals visible to current role.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProposalStatus"
      responses:
        "200":
          description: Paged delivery proposals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryProposalListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [DeliveryProposals]
      operationId: createDeliveryProposal
      summary: Create a delivery proposal. Volunteer only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeliveryProposalRequest"
      responses:
        "201":
          description: Delivery proposal created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryProposal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /delivery-proposals/{id}/accept:
    post:
      tags: [DeliveryProposals]
      operationId: acceptDeliveryProposal
      summary: Accept delivery proposal as donor or receiver.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Delivery proposal accepted by current actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryProposalAcceptResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /delivery-proposals/{id}/reject:
    post:
      tags: [DeliveryProposals]
      operationId: rejectDeliveryProposal
      summary: Reject delivery proposal as donor or receiver.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Delivery proposal rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryProposal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /pickups/{id}/pickup:
    post:
      tags: [Pickups]
      operationId: markPickupPickedUp
      summary: Mark pickup as picked up. Assigned volunteer only.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePickupStatusRequest"
      responses:
        "200":
          description: Pickup marked picked up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pickup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /pickups/{id}/deliver:
    post:
      tags: [Pickups]
      operationId: markPickupDelivered
      summary: Mark pickup as delivered. Assigned volunteer only.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePickupStatusRequest"
      responses:
        "200":
          description: Pickup marked delivered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pickup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List notifications.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paged notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /notifications/{id}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark notification read.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Notification marked read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /notifications/stream:
    get:
      tags: [Notifications]
      operationId: streamNotifications
      summary: Stream current notifications as Server-Sent Events.
      responses:
        "200":
          description: Server-Sent Events stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated user cannot perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    UserRole:
      type: string
      enum: [donor, receiver, volunteer]
    ContactMethod:
      type: string
      enum: [whatsapp, instagram, phone, email, other]
    EntityType:
      type: string
      enum: [charity, orphanage, shelter, family, restaurant, warteg, individual, other]
    DonationStatus:
      type: string
      enum: [available, proposal_pending, pickup_assigned, picked_up, delivered, canceled]
    ProposalStatus:
      type: string
      enum: [pending, accepted, rejected, canceled]
    PickupStatus:
      type: string
      enum: [assigned, picked_up, delivered, canceled]
    NotificationType:
      type: string
      enum: [donation_created, proposal_created, proposal_accepted, proposal_rejected, pickup_assigned, pickup_completed]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    User:
      type: object
      additionalProperties: false
      required: [id, name, email, role, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        phone:
          type: string
        createdAt:
          type: string
          format: date-time
    Location:
      type: object
      additionalProperties: false
      required: [addressLine1, city, region, postalCode, country]
      properties:
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        region:
          type: string
        postalCode:
          type: string
        country:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    Profile:
      type: object
      additionalProperties: false
      required: [userId, displayName, role, contactMethod, contactValue, location, createdAt, updatedAt]
      properties:
        userId:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        contactMethod:
          $ref: "#/components/schemas/ContactMethod"
        contactValue:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        entityType:
          $ref: "#/components/schemas/EntityType"
        operationalHours:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Donation:
      type: object
      additionalProperties: false
      required: [id, donorId, title, description, quantity, status, pickupLocation, availableFrom, availableUntil, createdAt, updatedAt]
      properties:
        id:
          type: string
        donorId:
          type: string
        title:
          type: string
        description:
          type: string
        quantity:
          type: string
        imageUrl:
          type: string
          maxLength: 2048
        status:
          $ref: "#/components/schemas/DonationStatus"
        pickupLocation:
          $ref: "#/components/schemas/Location"
        availableFrom:
          type: string
          format: date-time
        availableUntil:
          type: string
          format: date-time
        specialInstructions:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeliveryProposal:
      type: object
      additionalProperties: false
      required: [id, donationId, receiverId, volunteerId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        donationId:
          type: string
        receiverId:
          type: string
        volunteerId:
          type: string
        status:
          $ref: "#/components/schemas/ProposalStatus"
        donorAcceptedAt:
          type: string
          format: date-time
        receiverAcceptedAt:
          type: string
          format: date-time
        rejectedByUserId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Pickup:
      type: object
      additionalProperties: false
      required: [id, donationId, proposalId, receiverId, volunteerId, status, pickupLocation, deliveryLocation, createdAt, updatedAt]
      properties:
        id:
          type: string
        donationId:
          type: string
        proposalId:
          type: string
        receiverId:
          type: string
        volunteerId:
          type: string
        status:
          $ref: "#/components/schemas/PickupStatus"
        pickupLocation:
          $ref: "#/components/schemas/Location"
        deliveryLocation:
          $ref: "#/components/schemas/Location"
        pickedUpAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Notification:
      type: object
      additionalProperties: false
      required: [id, userId, type, title, body, read, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          $ref: "#/components/schemas/NotificationType"
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        donationId:
          type: string
        proposalId:
          type: string
        pickupId:
          type: string
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
    DemoLoginRequest:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
    DemoLoginResponse:
      type: object
      additionalProperties: false
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        user:
          $ref: "#/components/schemas/User"
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [displayName, contactMethod, contactValue, location]
      properties:
        displayName:
          type: string
        contactMethod:
          $ref: "#/components/schemas/ContactMethod"
        contactValue:
          type: string
        location:
          $ref: "#/components/schemas/Location"
        entityType:
          $ref: "#/components/schemas/EntityType"
        operationalHours:
          type: string
        notes:
          type: string
    CreateDonationRequest:
      type: object
      additionalProperties: false
      required: [title, description, quantity, pickupLocation, availableFrom, availableUntil]
      properties:
        title:
          type: string
        description:
          type: string
        quantity:
          type: string
        imageUrl:
          type: string
          maxLength: 2048
        pickupLocation:
          $ref: "#/components/schemas/Location"
        availableFrom:
          type: string
          format: date-time
        availableUntil:
          type: string
          format: date-time
        specialInstructions:
          type: string
    CreateDeliveryProposalRequest:
      type: object
      additionalProperties: false
      required: [donationId, receiverId]
      properties:
        donationId:
          type: string
        receiverId:
          type: string
    UpdatePickupStatusRequest:
      type: object
      additionalProperties: false
      properties:
        occurredAt:
          type: string
          format: date-time
    DeliveryProposalAcceptResponse:
      type: object
      additionalProperties: false
      required: [proposal]
      properties:
        proposal:
          $ref: "#/components/schemas/DeliveryProposal"
        pickup:
          $ref: "#/components/schemas/Pickup"
    DonationListResponse:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Donation"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ProfileListResponse:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    DeliveryProposalListResponse:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryProposal"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    NotificationListResponse:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
