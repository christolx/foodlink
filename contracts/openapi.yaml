openapi: 3.0.3
info:
  title: FoodLink API
  version: 1.0.0
  description: Contract-first API for the FoodLink demo happy path.
  license:
    name: Proprietary
    url: https://foodlink.local/license
servers:
  - url: /api/v1
    description: Version 1 API base path
tags:
  - name: Auth
    description: Demo authentication endpoints.
  - name: Users
    description: Current user endpoints.
  - name: Donations
    description: Donation creation, listing, detail, and claim entrypoints.
  - name: Claims
    description: Claim approval and rejection endpoints.
  - name: Pickups
    description: Pickup assignment and fulfillment endpoints.
  - name: Notifications
    description: Notification polling and streaming endpoints.
security:
  - bearerAuth: []
paths:
  /auth/demo-login:
    post:
      tags:
        - Auth
      operationId: demoLogin
      summary: Log in as a demo user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoLoginRequest"
      responses:
        "200":
          description: Demo login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoLoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /me:
    get:
      tags:
        - Users
      operationId: getMe
      summary: Get the current authenticated user.
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /donations:
    get:
      tags:
        - Donations
      operationId: listDonations
      summary: List donations.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DonationStatus"
        - name: role
          in: query
          required: false
          description: Filter donations for a demo role-specific view.
          schema:
            $ref: "#/components/schemas/UserRole"
      responses:
        "200":
          description: Paged donations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Donations
      operationId: createDonation
      summary: Create a donation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDonationRequest"
      responses:
        "201":
          description: Donation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /donations/{id}:
    get:
      tags:
        - Donations
      operationId: getDonation
      summary: Get a donation by ID.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Donation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /donations/{id}/claim:
    post:
      tags:
        - Donations
      operationId: claimDonation
      summary: Claim a donation.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimDonationRequest"
      responses:
        "201":
          description: Claim created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /claims/{id}/approve:
    post:
      tags:
        - Claims
      operationId: approveClaim
      summary: Approve a claim and create or return its pickup.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveClaimRequest"
      responses:
        "200":
          description: Approved claim and pickup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveClaimResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /claims/{id}/reject:
    post:
      tags:
        - Claims
      operationId: rejectClaim
      summary: Reject a claim.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectClaimRequest"
      responses:
        "200":
          description: Claim rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /pickups/{id}/assign-volunteer:
    post:
      tags:
        - Pickups
      operationId: assignPickupVolunteer
      summary: Assign a volunteer to a pickup.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignVolunteerRequest"
      responses:
        "200":
          description: Pickup volunteer assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pickup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /pickups/{id}/pickup:
    post:
      tags:
        - Pickups
      operationId: markPickupPickedUp
      summary: Mark a pickup as picked up.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePickupStatusRequest"
      responses:
        "200":
          description: Pickup marked picked up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pickup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /pickups/{id}/deliver:
    post:
      tags:
        - Pickups
      operationId: markPickupDelivered
      summary: Mark a pickup as delivered.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePickupStatusRequest"
      responses:
        "200":
          description: Pickup marked delivered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pickup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /notifications:
    get:
      tags:
        - Notifications
      operationId: listNotifications
      summary: List notifications.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paged notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /notifications/{id}/read:
    post:
      tags:
        - Notifications
      operationId: markNotificationRead
      summary: Mark a notification as read.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Notification marked read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /notifications/stream:
    get:
      tags:
        - Notifications
      operationId: streamNotifications
      summary: Stream live notifications with Server-Sent Events.
      responses:
        "200":
          description: Server-Sent Events stream of notifications.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                notification:
                  summary: Notification event
                  value: |
                    event: notification
                    data: {"id":"notif_123","userId":"user_456","type":"claim_created","title":"New claim","body":"A receiver claimed your donation.","read":false,"createdAt":"2026-05-20T12:00:00Z"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource ID.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: One-based page number.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of items per page.
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated user cannot perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    UserRole:
      type: string
      enum:
        - donor
        - receiver
        - volunteer
    DonationStatus:
      type: string
      enum:
        - available
        - claimed
        - approved
        - pickup_assigned
        - picked_up
        - delivered
        - canceled
    ClaimStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
    PickupStatus:
      type: string
      enum:
        - pending_assignment
        - assigned
        - picked_up
        - delivered
        - canceled
    NotificationType:
      type: string
      enum:
        - donation_created
        - claim_created
        - claim_approved
        - claim_rejected
        - pickup_assigned
        - pickup_completed
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: validation_failed
        message:
          type: string
          description: Human-readable error message.
          example: Request validation failed.
        details:
          description: Optional field errors or domain-specific context.
          type: object
          additionalProperties: false
          properties:
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
            context:
              type: object
              additionalProperties:
                type: string
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - role
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        phone:
          type: string
        createdAt:
          type: string
          format: date-time
    Location:
      type: object
      additionalProperties: false
      required:
        - addressLine1
        - city
        - region
        - postalCode
        - country
      properties:
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        region:
          type: string
        postalCode:
          type: string
        country:
          type: string
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    Donation:
      type: object
      additionalProperties: false
      required:
        - id
        - donorId
        - title
        - description
        - quantity
        - status
        - pickupLocation
        - availableFrom
        - availableUntil
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        donorId:
          type: string
        title:
          type: string
        description:
          type: string
        quantity:
          type: string
          description: Human-readable food quantity for demo scope.
          example: 12 boxed meals
        status:
          $ref: "#/components/schemas/DonationStatus"
        pickupLocation:
          $ref: "#/components/schemas/Location"
        availableFrom:
          type: string
          format: date-time
        availableUntil:
          type: string
          format: date-time
        specialInstructions:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Claim:
      type: object
      additionalProperties: false
      required:
        - id
        - donationId
        - receiverId
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        donationId:
          type: string
        receiverId:
          type: string
        status:
          $ref: "#/components/schemas/ClaimStatus"
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Pickup:
      type: object
      additionalProperties: false
      required:
        - id
        - donationId
        - claimId
        - status
        - pickupLocation
        - deliveryLocation
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        donationId:
          type: string
        claimId:
          type: string
        volunteerId:
          type: string
        status:
          $ref: "#/components/schemas/PickupStatus"
        pickupLocation:
          $ref: "#/components/schemas/Location"
        deliveryLocation:
          $ref: "#/components/schemas/Location"
        pickedUpAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Notification:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - type
        - title
        - body
        - read
        - createdAt
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          $ref: "#/components/schemas/NotificationType"
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        donationId:
          type: string
        claimId:
          type: string
        pickupId:
          type: string
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
    DemoLoginRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        userId:
          type: string
          description: Existing demo user ID.
        role:
          $ref: "#/components/schemas/UserRole"
    DemoLoginResponse:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - user
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
          default: Bearer
        user:
          $ref: "#/components/schemas/User"
    CreateDonationRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - description
        - quantity
        - pickupLocation
        - availableFrom
        - availableUntil
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        quantity:
          type: string
          minLength: 1
        pickupLocation:
          $ref: "#/components/schemas/Location"
        availableFrom:
          type: string
          format: date-time
        availableUntil:
          type: string
          format: date-time
        specialInstructions:
          type: string
    ClaimDonationRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type: string
    ApproveClaimRequest:
      type: object
      additionalProperties: false
      required:
        - deliveryLocation
      properties:
        deliveryLocation:
          $ref: "#/components/schemas/Location"
    ApproveClaimResponse:
      type: object
      additionalProperties: false
      required:
        - claim
        - pickup
      properties:
        claim:
          $ref: "#/components/schemas/Claim"
        pickup:
          $ref: "#/components/schemas/Pickup"
    RejectClaimRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    AssignVolunteerRequest:
      type: object
      additionalProperties: false
      required:
        - volunteerId
      properties:
        volunteerId:
          type: string
    UpdatePickupStatusRequest:
      type: object
      additionalProperties: false
      properties:
        occurredAt:
          type: string
          format: date-time
        note:
          type: string
    DonationListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Donation"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    NotificationListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
