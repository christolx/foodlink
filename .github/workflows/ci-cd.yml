name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify dependencies
        run: go mod download

      - name: Check Go format
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files not formatted correctly. Run gofmt -w ."
            gofmt -l .
            exit 1
          fi

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test -v -race ./...

      - name: Build Go binary
        run: go build -v ./cmd/api

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome linter
        run: pnpm lint

      - name: Build frontend
        run: pnpm build
